apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-governance-core.fullname" . }}-secrets
  labels:
    {{- include "agent-governance-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST:     {{ required ".Values.secrets.dbHost is required" .Values.secrets.dbHost | quote }}
  DB_PORT:     {{ .Values.secrets.dbPort | quote }}
  DB_USER:     {{ required ".Values.secrets.dbUser is required" .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ required ".Values.secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  DB_NAME:     {{ required ".Values.secrets.dbName is required" .Values.secrets.dbName | quote }}
  DB_SSLMODE:  {{ .Values.secrets.dbSslMode | quote }}
